<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <title>AdamN — نظام إدارة الحضانة</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="boot" class="boot-screen">
    <div class="boot-logo">A</div>
    <div class="boot-text">AdamN</div>
    <div class="spinner"></div>
  </div>

  <div id="login-root" class="hidden"></div>

  <div id="app" class="app-shell hidden">
    <header class="app-header">
      <div class="header-top">
        <a class="brand" href="#/students" aria-label="AdamN">
          <span class="brand-mark">A</span>
          <span class="brand-text">
            <strong>AdamN</strong>
            <small id="brand-nursery">نظام إدارة الحضانة</small>
          </span>
        </a>

        <div class="header-actions">
          <button class="icon-btn" id="btn-lang" title="اللغة / Language">
            <span id="lang-label">EN</span>
          </button>

          <div class="notif-wrap">
            <button class="icon-btn" id="btn-notifications" title="مركز التنبيهات" aria-label="مركز التنبيهات">
              <span class="icon">🔔</span>
              <span id="notif-badge" class="badge-dot hidden">0</span>
            </button>
            <div id="notif-panel" class="notif-panel hidden"></div>
          </div>

          <div class="user-wrap">
            <button class="user-btn" id="btn-user">
              <span class="avatar" id="user-avatar">م</span>
              <span class="user-meta">
                <strong id="user-name">—</strong>
                <small id="user-role">—</small>
              </span>
              <span class="chev">▾</span>
            </button>
            <div id="user-menu" class="dropdown hidden">
              <button data-action="settings">⚙️ <span data-i18n="nav.settings">الإعدادات</span></button>
              <button data-action="password">🔑 <span data-i18n="auth.changePassword">تغيير كلمة المرور</span></button>
              <button data-action="logout" class="danger">🚪 <span data-i18n="auth.logout">تسجيل الخروج</span></button>
            </div>
          </div>
        </div>
      </div>

      <nav class="tabs" id="main-tabs">
        <a class="tab" href="#/students" data-view="students"><span class="tab-icon">🎓</span><span data-i18n="nav.students">الطلاب</span></a>
        <a class="tab" href="#/staff" data-view="staff"><span class="tab-icon">👩‍🏫</span><span data-i18n="nav.staff">الموظفون</span></a>
        <a class="tab" href="#/revenue" data-view="revenue"><span class="tab-icon">➕</span><span data-i18n="nav.revenue">إيرادات أخرى</span></a>
        <a class="tab" href="#/expenses" data-view="expenses"><span class="tab-icon">➖</span><span data-i18n="nav.expenses">المصروفات</span></a>
        <a class="tab" href="#/finance" data-view="finance"><span class="tab-icon">📊</span><span data-i18n="nav.finance">المالية</span></a>
        <a class="tab" href="#/settings" data-view="settings"><span class="tab-icon">⚙️</span><span data-i18n="nav.settings">الإعدادات</span></a>
      </nav>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <footer class="app-footer">
      <span>AdamN NMS • <span id="footer-file">—</span></span>
      <span id="footer-tz">—</span>
    </footer>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
